<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เกมลบเลขแสนสนุก</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .math-row { font-size: clamp(32px, 8vw, 54px); text-align: center; margin: 30px 0; word-break: break-word; }
    .options-row { display: flex; justify-content: center; gap: 20px; margin-top: 30px; flex-wrap: wrap; }
    .option-btn { font-size: 40px; padding: 20px 40px; border-radius: 15px; border: 3px solid #ccc; background: #fff; cursor: pointer; transition: all 0.2s ease; touch-action: manipulation; }
    .option-btn:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    .option-btn:active { background: #e0e0e0; transform: translateY(0); }
    .option-btn.wrong { background-color: #FFCDD2; border-color: #E53935; animation: shake 0.5s; }
    .crossed {
      position: relative;
      display: inline-block;
      opacity: 0.6;
    }
    .crossed::after {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      border-bottom: 6px solid #E53935;
      transform: rotate(-15deg);
      transform-origin: center;
    }
    
    #feedback-message { min-height: 40px; font-size: 24px; text-align: center; font-weight: bold; margin-top: 15px; transition: color 0.3s; }
    .feedback-error { color: #d32f2f; }
    
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }
  </style>
  <script src="data-subtraction.js"></script>
</head>
<body>
  <div class="container" id="game-container">
    <a href="index.html" class="btn" style="background-color: #FB8C00;">⬅️ กลับหน้าหลัก</a>
    <div class="header">
      <h1 class="title">เกมนับเลขหักออก (ลบเลข)</h1>
      <p style="font-size: 20px;">นับตัวช่วยหักออกสีแดงและหาคำตอบกันนะ!</p>
    </div>
    
    <div id="visual-area" class="math-row"></div>
    <div id="formula-area" class="math-row"></div>
    <div id="options-area" class="options-row"></div>
    <div id="feedback-message"></div>
  </div>

  <div id="celebration" class="celebration">
    <h1 style="font-size: 60px; color: var(--success);">🎉 ถูกต้องแล้ว! ยอดเยี่ยมมาก 🎉</h1>
    <button class="btn" style="background-color: #FB8C00; font-size: 1.5rem; padding: 16px 32px;" onclick="nextQuestion()">ทำข้อต่อไป</button>
  </div>

  <script>
    let currentIdx = 0;
    let questions = [];

    try {
      if (typeof window.subtractionData !== 'undefined') {
        questions = window.subtractionData.interactive;
        loadQuestion();
      } else {
        throw new Error("window.subtractionData is undefined");
      }
    } catch (err) {
      console.error("Failed to load questions:", err);
      document.getElementById('game-container').innerHTML = `
        <div class="header">
          <h1 class="title" style="color: #d32f2f;">❌ เกิดข้อผิดพลาดในการโหลดข้อมูล</h1>
        </div>
      `;
    }

    function loadQuestion() {
      document.getElementById('celebration').classList.remove('show');
      document.getElementById('feedback-message').textContent = '';
      document.getElementById('feedback-message').className = '';
      
      if (currentIdx >= questions.length) {
        document.getElementById('game-container').innerHTML = `
          <div class="header">
            <h1 class="title">🎉 เก่งมากจ๊ะ! ทำกิจกรรมการลบครบหมดแล้ว 🎉</h1>
            <a href="index.html" class="btn" style="background-color: #FB8C00;">กลับหน้าหลัก</a>
          </div>
        `;
        return;
      }
      const q = questions[currentIdx];
      
      const items = Array.from(q.visual);
      const normalCount = q.num1 - q.num2;
      let visualHtml = '';
      for(let i=0; i<items.length; i++) {
        if (i >= normalCount) {
          visualHtml += `<span class="crossed">${items[i]}</span>`;
        } else {
          visualHtml += items[i];
        }
      }

      document.getElementById('visual-area').innerHTML = visualHtml;
      document.getElementById('formula-area').innerHTML = `${q.num1} - ${q.num2} = ?`;
      
      let optionsHtml = '';
      q.options.forEach(opt => {
        optionsHtml += `<button class="option-btn" onclick="checkAnswer(${opt}, this)">${opt}</button>`;
      });
      document.getElementById('options-area').innerHTML = optionsHtml;
    }

    function checkAnswer(selected, btnEl) {
      const q = questions[currentIdx];
      if (selected === q.answer) {
        document.getElementById('celebration').classList.add('show');
      } else {
        btnEl.classList.add('wrong');
        const feedback = document.getElementById('feedback-message');
        feedback.textContent = 'ลองนับสิ่งของที่เหลืออยู่ดีๆ อีกครั้งนะจ๊ะ! 🍌';
        feedback.className = 'feedback-error';
        setTimeout(() => {
          btnEl.classList.remove('wrong');
        }, 1000);
      }
    }

    function nextQuestion() {
      currentIdx++;
      loadQuestion();
    }
  </script>
  <script src="bgm.js"></script>
</body>
</html>
