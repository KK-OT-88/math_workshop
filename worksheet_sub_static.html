<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ใบงานการลบเลขคณิตศาสตร์</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .static-item { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px dashed #FFB74D; padding: 20px 0; gap: 15px; }
    .static-visual { font-size: clamp(24px, 5vw, 38px); }
    .static-formula { font-size: clamp(20px, 4vw, 34px); font-weight: bold; }
    .static-answer-container { display: flex; align-items: center; gap: 10px; }
    
    .static-answer { 
      width: 140px; 
      height: 80px; 
      border: 4px solid #FB8C00; 
      border-radius: 15px; 
      text-align: center; 
      font-size: 36px; 
      font-weight: bold;
      transition: all 0.3s;
      outline: none;
      touch-action: manipulation;
    }
    
    .static-answer:focus {
      border-color: #E65100;
      box-shadow: 0 0 10px rgba(251, 140, 0, 0.3);
    }
    
    .static-answer.correct {
      border-color: var(--success);
      background-color: #E8F5E9;
      color: #2E7D32;
    }
    
    .static-answer.wrong {
      border-color: #E53935;
      background-color: #FFEBEE;
      color: #C62828;
    }
    
    .status-icon { font-size: 36px; width: 45px; display: inline-block; text-align: center; }
  </style>
  <script src="data-subtraction.js"></script>
</head>
<body>
  <div class="container">
    <a href="index.html" class="btn" style="background-color: #FB8C00;">⬅️ กลับหน้าหลัก</a>
    <div class="header">
      <h1 class="title">ใบงานฝึกเติมผลลัพธ์การลบ</h1>
      <p style="font-size: 20px;">ขีดฆ่าภาพประกอบแล้วเติมตัวเลขคำตอบลงในช่องว่าง</p>
    </div>
    
    <div id="static-list"></div>
  </div>

  <script>
    try {
      if (typeof window.subtractionData !== 'undefined') {
        const data = window.subtractionData;
        let listHtml = '';
        data.static.forEach((item, idx) => {
          const expectedAnswer = item.num1 - item.num2;
          listHtml += `
            <div class="static-item">
              <div class="static-visual">${item.visual} (หักออก ${item.num2})</div>
              <div class="static-formula">${item.num1} - ${item.num2} = </div>
              <div class="static-answer-container">
                <input type="text" 
                       class="static-answer" 
                       inputmode="numeric" 
                       pattern="[0-9]*"
                       aria-label="คำตอบสำหรับ ${item.num1} หักออก ${item.num2}"
                       oninput="verifyAnswer(this, ${expectedAnswer})">
                <span class="status-icon" id="status-${idx}"></span>
              </div>
            </div>
          `;
        });
        document.getElementById('static-list').innerHTML = listHtml;
      } else {
        throw new Error("window.subtractionData is undefined");
      }
    } catch (err) {
      console.error("Failed to load static items:", err);
      document.getElementById('static-list').innerHTML = `<p style="color: #d32f2f; text-align: center;">❌ เกิดข้อผิดพลาดในการโหลดข้อมูล</p>`;
    }

    function verifyAnswer(inputEl, expected) {
      const val = inputEl.value.trim();
      const statusIcon = inputEl.nextElementSibling;
      
      if (val === '') {
        inputEl.className = 'static-answer';
        statusIcon.textContent = '';
        return;
      }
      
      if (parseInt(val, 10) === expected) {
        inputEl.className = 'static-answer correct';
        statusIcon.textContent = '✅';
      } else {
        inputEl.className = 'static-answer wrong';
        statusIcon.textContent = '❌';
      }
    }
  </script>
  <script src="bgm.js"></script>
</body>
</html>
